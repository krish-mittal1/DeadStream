# ── Grafana datasource configuration ────────────────────────────
# Auto-provisioned at startup.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: yes
    editable: false
    jsonData:
      timeInterval: "10s"

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: no
    editable: false
    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: 'trace_id=(\w+)'
          url: 'http://tempo:3200/explore?traceId=$${__value.raw}'
