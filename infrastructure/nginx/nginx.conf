# ── DeadStream – Nginx Reverse Proxy ─────────────────────────────
# In production, replace the self-signed certificate with
# a Let's Encrypt certificate via certbot.
#
# Usage in docker-compose:
#   volumes:
#     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
#     - ./nginx/certs:/etc/nginx/certs:ro
#   ports:
#     - "80:80"
#     - "443:443"

events {
    worker_connections 1024;
}

http {
    # ── Upstreams ────────────────────────────────────────────
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # ── MIME types ───────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Security headers ─────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY"    always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Logging ──────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── HTTP → HTTPS redirect ────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ─────────────────────────────────────────
    server {
        listen 443 ssl http2 default_server;
        server_name _;

        # TLS certificates (self-signed for dev; use Let's Encrypt in production)
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Modern TLS configuration
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       10m;
        ssl_session_tickets       off;

        # HSTS — force HTTPS for 2 years including all subdomains
        # ⚠ Verify HTTPS works before enabling this in production
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ── API & WebSocket proxy ────────────────────────────
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host                    $host;
            proxy_set_header X-Real-IP               $remote_addr;
            proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto       $scheme;
            proxy_set_header X-Forwarded-Host        $host;
            proxy_read_timeout    90s;
            proxy_connect_timeout 10s;
        }

        # WebSocket (Socket.IO) proxy
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade                 $http_upgrade;
            proxy_set_header Connection              "upgrade";
            proxy_set_header Host                    $host;
            proxy_set_header X-Real-IP               $remote_addr;
            proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto       $scheme;
            proxy_read_timeout    86400s;
            proxy_send_timeout    86400s;
        }

        # Prometheus metrics (internal-only in production)
        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
            proxy_pass http://backend;
        }

        # ── Frontend proxy ───────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host                    $host;
            proxy_set_header X-Real-IP               $remote_addr;
            proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto       $scheme;
            proxy_read_timeout    30s;
            proxy_connect_timeout 10s;
        }
    }
}
