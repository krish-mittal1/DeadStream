[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "deadstream-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.31.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "redis>=5.0",
  "python-socketio[asgi]>=5.11",
  "bcrypt>=5.0",
  "python-jose[cryptography]>=3.3",
  "prometheus-client>=0.20",
  "structlog>=24.1",
  "httpx>=0.27",
  "pgvector>=0.2.5",
  "alembic>=1.13",
  "slowapi>=0.1.9",
  "sentence-transformers>=3.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "types-python-jose",
]



[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
exclude = ["tests"]

# Third-party libraries without type stubs — suppress noise from untyped libraries
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require a database (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]
