[project]
name = "deadstream-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "redis>=5.0",
  "python-socketio[asgi]>=5.11",
  "passlib[bcrypt]>=1.7",
  "python-jose[cryptography]>=3.3",
  "prometheus-client>=0.20",
  "structlog>=24.1",
  "httpx>=0.27",
  "pgvector>=0.2.5",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
